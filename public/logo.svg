<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16241e"/>
      <stop offset="1" stop-color="#0c1310"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd49a"/>
      <stop offset="1" stop-color="#2c7a58"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#2c7a58" stroke-width="6"/>

  <!-- branches -->
  <g fill="none" stroke="#3fb27f" stroke-width="14" stroke-linecap="round">
    <path d="M236 256 C 300 256, 300 168, 360 168"/>
    <path d="M236 256 C 300 256, 300 256, 360 256"/>
    <path d="M236 256 C 300 256, 300 344, 360 344"/>
  </g>
  <g fill="none" stroke="#7fe0c8" stroke-width="10" stroke-linecap="round" opacity="0.65">
    <path d="M168 200 C 120 200, 120 312, 168 312"/>
  </g>

  <!-- central node (diamond, echoing the ◆ brand mark) -->
  <rect x="150" y="206" width="100" height="100" rx="22" transform="rotate(45 200 256)" fill="url(#node)" stroke="#bff3dd" stroke-width="6"/>

  <!-- leaf nodes -->
  <circle cx="372" cy="168" r="30" fill="#3fb27f"/>
  <circle cx="372" cy="256" r="30" fill="#d9a441"/>
  <circle cx="372" cy="344" r="30" fill="#56b6c2"/>
</svg>
